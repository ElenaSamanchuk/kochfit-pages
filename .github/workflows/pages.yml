name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages отдаёт сайт по адресу https://<user>.github.io/kochfit-pages/,
# поэтому сборке нужен basePath. Обе переменные обязательны:
# KOCHFIT_BASE_PATH — маршруты и /_next (next.config.ts),
# NEXT_PUBLIC_BASE_PATH — assetPath() для <img src> из public/.
# Без второй картинки уходят без префикса и отдают 404.
env:
  BASE_PATH: /kochfit-pages

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE_PATH }}
          KOCHFIT_BASE_PATH: ${{ env.BASE_PATH }}
      - name: Проверить, что пути получили префикс
        run: |
          missing=$(grep -roE 'src="/(images|_next)[^"]*"' out/index.html | wc -l)
          if [ "$missing" -ne 0 ]; then
            echo "::error::В сборке $missing путей без basePath — на Pages они дадут 404"
            exit 1
          fi
      # Копия на Pages не должна индексироваться как дубль kochfit.ru.
      # Свой X-Robots-Tag Pages не позволяет, поэтому meta в каждый HTML;
      # robots.txt здесь не помогает: поисковик читает только корень домена.
      - name: Закрыть копию от индексации (noindex)
        run: |
          find out -name '*.html' -print0 | xargs -0 perl -0pi -e 's/<head>/<head><meta name="robots" content="noindex, nofollow"\/>/ unless /name="robots"/'
          total=$(find out -name '*.html' | wc -l)
          bad=$(grep -rL 'name="robots" content="noindex' --include='*.html' out | wc -l)
          echo "HTML: $total, без noindex: $bad"
          if [ "$total" -eq 0 ] || [ "$bad" -ne 0 ]; then
            echo "::error::noindex проставлен не во все страницы"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
